; ClocTeck HoloCubic (ESP32-S3R8, 8MB flash with flash encryption ON, 8MB octal PSRAM).
;   pio run              build
;   pio run -t upload    flash through flash.py (encrypted). Never use a plain esptool upload on this device.
[env:holocubic]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
monitor_speed = 115200
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Bluetooth keyboard input only needs the central role and one link
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
upload_protocol = custom
upload_command = $PYTHONEXE flash.py $SOURCE
